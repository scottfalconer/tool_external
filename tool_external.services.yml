services:
  logger.channel.tool_external:
    parent: logger.channel_base
    arguments: ['tool_external']
  tool_external.definition_factory:
    class: Drupal\tool_external\Definition\DefinitionFactory
    arguments: ['@validation.constraint']
  tool_external.stable_config:
    class: Drupal\tool_external\Config\StableConfigReader
    arguments: ['@config.factory']
  tool_external.definition_import:
    class: Drupal\tool_external\EventSubscriber\DefinitionImportSubscriber
    arguments: ['@tool_external.definition_factory', '@tool_external.stable_config']
    tags:
      - { name: event_subscriber }
  tool_external.definition_cache:
    class: Drupal\tool_external\EventSubscriber\DefinitionCacheSubscriber
    arguments: ['@service_container']
    tags:
      - { name: event_subscriber }
  tool_external.connections:
    class: Drupal\tool_external\Transport\ConnectionResolver
    arguments: ['@tool_external.stable_config', '@settings']
  tool_external.client:
    class: Drupal\tool_external\Transport\ExternalClient
    arguments: ['@http_client', '@tool_external.stable_config', '@tool_external.connections', '@tool_external.definition_factory', '@uuid', '@current_user', '@logger.channel.tool_external', '@datetime.time']
  tool_external.definition_serializer:
    class: Drupal\tool_external\Normalizer\ExternalToolDefinitionSerializer
    decorates: tool.definition_serializer
    arguments: ['@tool_external.definition_serializer.inner']

